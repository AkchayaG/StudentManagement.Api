
<div class="form-page">
  <div class="form-card">
    <h2>Edit Department</h2>

    <p *ngIf="loading()">Loading department...</p>

    <form *ngIf="!loading()" (ngSubmit)="update()">
      <label>Department Code</label>
      <input
        name="code"
        [(ngModel)]="code"
        maxlength="20"
        required
      />

      <label>Department Name</label>
      <input
        name="name"
        [(ngModel)]="name"
        maxlength="100"
        required
      />

      <label>Description</label>
      <textarea
        name="description"
        [(ngModel)]="description"
        maxlength="250">
      </textarea>

      <p class="error" *ngIf="error()">{{ error() }}</p>

      <div class="buttons">
        <button type="button" class="cancel" (click)="cancel()">
          Cancel
        </button>

        <button type="submit" [disabled]="saving()">
          {{ saving() ? 'Updating...' : 'Update Department' }}
        </button>
      </div>
    </form>

    <button *ngIf="loading()" class="cancel" (click)="cancel()">
      Back
    </button>
  </div>
</div>
